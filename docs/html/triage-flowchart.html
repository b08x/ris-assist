<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticket triage — differential to routing</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #0f0a1a;   /* deep violet-black */
      --color-paper-2: #1a1025;   /* violet-card */
      --color-ink:     #fafafa;   /* charm-white */
      --color-muted:   #c4b5d0;   /* lavender */
      --color-soft:    #8b7a9e;
      --color-accent:  #ff6bcb;   /* charm-pink */
      --color-link:    #8b7aff;   /* violet */
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'JetBrains Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-mono);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · RIS Assist /triage</p>
    <h1>Ticket triage — differential to routing</h1>

    <svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="triage-flowchart-title triage-flowchart-desc">
      <title id="triage-flowchart-title">Ticket triage — differential to routing</title>
      <desc id="triage-flowchart-desc">Flowchart of the RIS Assist /triage skill: a vague ticket enters, the analyst asks discriminating questions that prune a five-branch differential until the ticket is routable, then produces a confidence-marked artifact with a queue and severity.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c4b5d0"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ff6bcb"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8b7aff"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#0f0a1a"/>

      <!-- Arrows (drawn first, behind nodes) -->
      <!-- Start → Overnight diamond -->
      <line x1="500" y1="88" x2="500" y2="112" stroke="#c4b5d0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Overnight YES → change-window (right) -->
      <line x1="600" y1="160" x2="660" y2="160" stroke="#c4b5d0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Overnight NO → scope (down) -->
      <line x1="500" y1="208" x2="500" y2="232" stroke="#c4b5d0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Change-window → scope (down, elbow left into right edge) -->
      <path d="M 750 184 L 750 248 A 8 8 0 0 1 742 256 L 580 256" fill="none" stroke="#c4b5d0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Scope → Differential -->
      <line x1="500" y1="280" x2="500" y2="304" stroke="#c4b5d0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Differential → Ask -->
      <line x1="500" y1="368" x2="500" y2="392" stroke="#c4b5d0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Ask → Routable diamond -->
      <line x1="500" y1="440" x2="500" y2="464" stroke="#c4b5d0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Routable NO → loop back to Ask (left side) -->
      <path d="M 400 512 L 352 512 A 8 8 0 0 0 344 504 L 344 424 A 8 8 0 0 0 352 416 L 360 416" fill="none" stroke="#c4b5d0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Routable YES → artifact (accent — happy path) -->
      <line x1="500" y1="560" x2="500" y2="584" stroke="#ff6bcb" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Arrow labels -->
      <rect x="614" y="140" width="32" height="12" rx="2" fill="#0f0a1a"/>
      <text x="630" y="149" fill="#c4b5d0" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

      <rect x="512" y="212" width="24" height="12" rx="2" fill="#0f0a1a"/>
      <text x="524" y="221" fill="#c4b5d0" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

      <rect x="364" y="492" width="24" height="12" rx="2" fill="#0f0a1a"/>
      <text x="376" y="501" fill="#c4b5d0" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

      <rect x="512" y="566" width="32" height="12" rx="2" fill="#0f0a1a"/>
      <text x="528" y="575" fill="#ff6bcb" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

      <!-- Start oval -->
      <rect x="420" y="40" width="160" height="48" rx="24" fill="rgba(250,250,250,0.03)" stroke="rgba(250,250,250,0.30)" stroke-width="1"/>
      <text x="500" y="64" fill="#fafafa" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Vague ticket</text>
      <text x="500" y="78" fill="#c4b5d0" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">arrives</text>

      <!-- Overnight diamond -->
      <polygon points="500,112 600,160 500,208 400,160" fill="#1a1025" stroke="#fafafa" stroke-width="1"/>
      <text x="500" y="156" fill="#fafafa" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Overnight</text>
      <text x="500" y="170" fill="#fafafa" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">shift?</text>

      <!-- Change-window step -->
      <rect x="660" y="136" width="180" height="48" rx="6" fill="#1a1025" stroke="#fafafa" stroke-width="1"/>
      <text x="750" y="156" fill="#fafafa" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Ask change-window</text>
      <text x="750" y="170" fill="#fafafa" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">question first</text>

      <!-- Scope step -->
      <rect x="420" y="232" width="160" height="48" rx="6" fill="#1a1025" stroke="#fafafa" stroke-width="1"/>
      <text x="500" y="256" fill="#fafafa" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Scope question</text>
      <text x="500" y="272" fill="#c4b5d0" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">1 user / 1 modality / all</text>

      <!-- Differential step -->
      <rect x="360" y="304" width="280" height="64" rx="6" fill="#1a1025" stroke="#fafafa" stroke-width="1"/>
      <text x="500" y="330" fill="#fafafa" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Differential — 5 branches</text>
      <text x="500" y="350" fill="#c4b5d0" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">RIS config · Interface · PACS</text>
      <text x="500" y="364" fill="#c4b5d0" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">Workstation · User</text>

      <!-- Ask discriminating question step -->
      <rect x="360" y="392" width="280" height="48" rx="6" fill="#1a1025" stroke="#fafafa" stroke-width="1"/>
      <text x="500" y="414" fill="#fafafa" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Ask discriminating question</text>
      <text x="500" y="430" fill="#c4b5d0" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">answer rules out branches</text>

      <!-- Routable diamond -->
      <polygon points="500,464 600,512 500,560 400,512" fill="#1a1025" stroke="#fafafa" stroke-width="1"/>
      <text x="500" y="506" fill="#fafafa" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Routable?</text>
      <text x="500" y="520" fill="#c4b5d0" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">rest ruled out</text>

      <!-- Triage artifact (accent focal) -->
      <rect x="400" y="584" width="200" height="56" rx="28" fill="rgba(255,107,203,0.10)" stroke="#ff6bcb" stroke-width="1"/>
      <text x="500" y="608" fill="#fafafa" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Triage artifact</text>
      <text x="500" y="624" fill="#c4b5d0" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">queue · severity · confidence</text>

      <!-- Legend -->
      <line x1="40" y1="664" x2="960" y2="664" stroke="rgba(250,250,250,0.10)" stroke-width="0.8"/>
      <text x="40" y="680" fill="#c4b5d0" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

      <rect x="40" y="696" width="24" height="12" rx="6" fill="rgba(250,250,250,0.03)" stroke="rgba(250,250,250,0.30)" stroke-width="1"/>
      <text x="72" y="706" fill="#c4b5d0" font-size="8" font-family="'Inter', sans-serif">Start / end</text>

      <rect x="190" y="696" width="24" height="12" rx="2" fill="#1a1025" stroke="#fafafa" stroke-width="1"/>
      <text x="222" y="706" fill="#c4b5d0" font-size="8" font-family="'Inter', sans-serif">Step</text>

      <polygon points="360,702 372,696 384,702 372,708" fill="#1a1025" stroke="#fafafa" stroke-width="1"/>
      <text x="392" y="706" fill="#c4b5d0" font-size="8" font-family="'Inter', sans-serif">Decision</text>

      <rect x="512" y="696" width="24" height="12" rx="2" fill="rgba(255,107,203,0.10)" stroke="#ff6bcb" stroke-width="1"/>
      <text x="544" y="706" fill="#c4b5d0" font-size="8" font-family="'Inter', sans-serif">Focal</text>

      <line x1="648" y1="702" x2="676" y2="702" stroke="#ff6bcb" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="684" y="706" fill="#c4b5d0" font-size="8" font-family="'Inter', sans-serif">Happy path</text>

      <line x1="808" y1="702" x2="836" y2="702" stroke="#c4b5d0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="844" y="706" fill="#c4b5d0" font-size="8" font-family="'Inter', sans-serif">Branch</text>
    </svg>
  </div>
</body>
</html>
