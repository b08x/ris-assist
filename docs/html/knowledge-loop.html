<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The knowledge capture loop</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@800&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #13161F; --ink: #F0F1F3; --muted: #7B8495; --soft: #8891A4;
      --accent: #01AAFF; --accent-tint: rgba(1,170,255,0.10); --link: #79C0FF;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Roboto Slab', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1200px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 0.75rem; color: var(--ink); font: 800 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    .subtitle { margin-bottom: 2rem; color: var(--muted); font: 400 0.9rem/1.5 var(--sans); }
    svg { display: block; width: 100%; min-width: 900px; }
    .ring { fill: none; stroke: var(--muted); stroke-width: 1.2; }
    .spoke { fill: none; stroke: var(--soft); stroke-width: 1; stroke-dasharray: 5 4; }
    .station { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
    .station.focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
    .hub { fill: var(--ink); }
    .node-name { fill: var(--ink); font: 600 12px var(--sans); text-anchor: middle; }
    .focal-name { fill: var(--accent); }
    .sublabel { fill: var(--soft); font: 400 8px var(--mono); text-anchor: middle; }
    .hub-name { fill: var(--paper); font: 600 16px var(--sans); text-anchor: middle; }
    .hub-sub { fill: var(--paper); opacity: 0.72; font: 400 8px var(--mono); text-anchor: middle; }
    .arrow-label { fill: var(--soft); font: 400 8px var(--mono); letter-spacing: 0.06em; text-anchor: middle; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Loop · Knowledge Capture</p>
    <h1>The knowledge capture loop</h1>
    <p class="subtitle">Six steps turn a resolved worklog into an uploadable article — and every published article writes durable state back to the knowledge base.</p>

    <svg viewBox="0 0 1040 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="knowledge-loop-title knowledge-loop-desc">
      <title id="knowledge-loop-title">The knowledge capture loop</title>
      <desc id="knowledge-loop-desc">Six stations — Capture, Draft, Format, Verify, Render, and Publish — turn a resolved worklog into an uploadable article around a central Knowledge base hub. Solid arrows flow clockwise through the steps while dashed spokes write durable state back to the hub; Capture is highlighted as the focal gate where the worklog is taken as given at resolution time.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(240,241,243,0.06)"/></pattern>
        <marker id="kloop-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7B8495"/></marker>
        <marker id="kloop-arr-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8891A4"/></marker>
      </defs>
      <rect width="1040" height="680" fill="#13161F"/>
      <rect width="1040" height="680" fill="url(#dots)" opacity="0.6"/>

      <!-- Solid clockwise ring: six arcs on the same r=240 station circle. -->
      <path class="ring" d="M600 113.726 A240 240 0 0 1 704.969 187.073" marker-end="url(#kloop-arr)"/>
      <path class="ring" d="M743.285 252 A240 240 0 0 1 743.722 426.882" marker-end="url(#kloop-arr)"/>
      <path class="ring" d="M705.731 492 A240 240 0 0 1 601.130 565.871" marker-end="url(#kloop-arr)"/>
      <path class="ring" d="M440 566.274 A240 240 0 0 1 335.031 492.927" marker-end="url(#kloop-arr)"/>
      <path class="ring" d="M296.715 428 A240 240 0 0 1 296.278 253.118" marker-end="url(#kloop-arr)"/>
      <path class="ring" d="M334.269 188 A240 240 0 0 1 438.870 114.129" marker-end="url(#kloop-arr)"/>

      <!-- Dashed write-backs: station inner edge to before the hub stroke. -->
      <path class="spoke" d="M520 132 V280" marker-end="url(#kloop-arr-soft)"/>
      <path class="spoke" d="M672 252 L616 284" marker-end="url(#kloop-arr-soft)"/>
      <path class="spoke" d="M672 428 L616 396" marker-end="url(#kloop-arr-soft)"/>
      <path class="spoke" d="M520 548 V400" marker-end="url(#kloop-arr-soft)"/>
      <path class="spoke" d="M368 428 L424 396" marker-end="url(#kloop-arr-soft)"/>
      <path class="spoke" d="M368 252 L424 284" marker-end="url(#kloop-arr-soft)"/>

      <!-- Curated spoke labels sit beside the line with a visible gap. -->
      <rect x="532" y="200" width="44" height="16" rx="4" fill="#13161F"/>
      <text x="554" y="212" class="arrow-label">SOURCE</text>
      <rect x="462" y="464" width="52" height="16" rx="4" fill="#13161F"/>
      <text x="488" y="476" class="arrow-label">ARTICLE</text>

      <!-- Stations -->
      <rect class="station focal" x="440" y="68" width="160" height="64" rx="6"/>
      <text x="520" y="96" class="node-name focal-name">Capture</text><text x="520" y="116" class="sublabel">worklog, taken as given</text>

      <rect class="station" x="648" y="188" width="160" height="64" rx="6"/>
      <text x="728" y="216" class="node-name">Draft</text><text x="728" y="236" class="sublabel">triage-ordered · cause marked</text>

      <rect class="station" x="648" y="428" width="160" height="64" rx="6"/>
      <text x="728" y="456" class="node-name">Format</text><text x="728" y="476" class="sublabel">ServiceNow Word-HTML</text>

      <rect class="station" x="440" y="548" width="160" height="64" rx="6"/>
      <text x="520" y="576" class="node-name">Verify</text><text x="520" y="596" class="sublabel">field checklist · no gaps</text>

      <rect class="station" x="232" y="428" width="160" height="64" rx="6"/>
      <text x="312" y="456" class="node-name">Render</text><text x="312" y="476" class="sublabel">one HTML → .docx</text>

      <rect class="station" x="232" y="188" width="160" height="64" rx="6"/>
      <text x="312" y="216" class="node-name">Publish</text><text x="312" y="236" class="sublabel">analyst uploads</text>

      <!-- The one shared-state hub. -->
      <rect class="hub" x="420" y="288" width="200" height="104" rx="8"/>
      <text x="520" y="336" class="hub-name">Knowledge base</text>
      <text x="520" y="360" class="hub-sub">articles · version/date</text>

      <!-- Legend — horizontal bottom strip -->
      <line x1="32" y1="636" x2="1008" y2="636" stroke="rgba(240,241,243,0.10)" stroke-width="0.8"/>
      <text x="32" y="652" fill="#7B8495" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="120" y1="648" x2="152" y2="648" stroke="#7B8495" stroke-width="1.2"/>
      <polygon points="160,648 152,645 152,651" fill="#7B8495"/>
      <text x="168" y="652" fill="#8891A4" font-size="8" font-family="'Geist Mono', monospace">Ring flow</text>
      <line x1="272" y1="648" x2="304" y2="648" stroke="#8891A4" stroke-width="1" stroke-dasharray="5 4"/>
      <polygon points="312,648 304,645 304,651" fill="#8891A4"/>
      <text x="320" y="652" fill="#8891A4" font-size="8" font-family="'Geist Mono', monospace">Write-back</text>
      <rect x="440" y="640" width="16" height="16" rx="3" fill="rgba(1,170,255,0.10)" stroke="#01AAFF" stroke-width="1"/>
      <text x="464" y="652" fill="#8891A4" font-size="8" font-family="'Geist Mono', monospace">Focal gate</text>
      <rect x="576" y="640" width="16" height="16" rx="3" fill="#F0F1F3"/>
      <text x="600" y="652" fill="#8891A4" font-size="8" font-family="'Geist Mono', monospace">Shared state</text>
    </svg>
  </main>
</body>
</html>
